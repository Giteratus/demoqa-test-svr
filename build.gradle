plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation(
            "com.codeborne:selenide:7.18.1",
            "org.junit.jupiter:junit-jupiter:5.11.0",
            'org.slf4j:slf4j-simple:2.0.20'
    )
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'  // обязательно!
}

test {
    useJUnitPlatform()
}